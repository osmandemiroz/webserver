# HW4 Review Config - RESTful API
# Each line calls a check function defined in review-hw.sh

PRJ="${ROOT}/BookLibraryREST"

section "1. Project Setup"
check_file  "BookLibraryREST.csproj exists"                 "${PRJ}/BookLibraryREST.csproj"
check_grep  "Targets net8.0"                                "net8\\.0"                                      "${PRJ}/BookLibraryREST.csproj"
check_file  "Program.cs exists"                             "${PRJ}/Program.cs"
check_grep  "Controllers registered"                        "AddControllers"                               "${PRJ}/Program.cs"
check_grep  "Controllers mapped"                            "MapControllers"                               "${PRJ}/Program.cs"

section "2. Models"
check_file  "Author model exists"                           "${PRJ}/Models/Author.cs"
check_grep  "Author: AuthorID property"                     "int AuthorID"                                  "${PRJ}/Models/Author.cs"
check_grep  "Author: AuthorName property"                   "string AuthorName"                             "${PRJ}/Models/Author.cs"
check_grep  "Author: AuthorInfo property"                   "string AuthorInfo"                             "${PRJ}/Models/Author.cs"

check_file  "Book model exists"                             "${PRJ}/Models/Book.cs"
check_grep  "Book: BookID property"                         "int BookID"                                    "${PRJ}/Models/Book.cs"
check_grep  "Book: Title property"                          "string Title"                                  "${PRJ}/Models/Book.cs"
check_grep  "Book: ReleaseYear property"                    "int ReleaseYear"                               "${PRJ}/Models/Book.cs"
check_grep  "Book: Price property"                          "double Price"                                  "${PRJ}/Models/Book.cs"
check_grep  "Book: AuthorID relationship"                   "int AuthorID"                                  "${PRJ}/Models/Book.cs"

check_file  "User model exists"                             "${PRJ}/Models/User.cs"
check_grep  "User: UserID property"                         "int UserID"                                    "${PRJ}/Models/User.cs"
check_grep  "User: Name property"                           "string Name"                                   "${PRJ}/Models/User.cs"
check_grep  "User: Email property"                          "string Email"                                  "${PRJ}/Models/User.cs"
check_grep  "User: RentedBookIDs field"                     "List<int> RentedBookIDs"                       "${PRJ}/Models/User.cs"

section "3. Layered Architecture"
check_dir   "Controllers folder exists"                     "${PRJ}/Controllers"
check_dir   "Services folder exists"                        "${PRJ}/Services"
check_dir   "Repositories folder exists"                    "${PRJ}/Repositories"
check_file  "Service interface exists"                      "${PRJ}/Services/ILibraryService.cs"
check_file  "Repository interface exists"                   "${PRJ}/Repositories/ILibraryRepository.cs"
check_grep  "Service registered in DI"                      "ILibraryService"                               "${PRJ}/Program.cs"
check_grep  "Repository registered in DI"                   "ILibraryRepository"                            "${PRJ}/Program.cs"

section "4. Author API"
check_file  "AuthorsController exists"                      "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "Authors route"                                "api/authors"                                   "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "List authors GET"                             "HttpGet"                                       "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "Get author by ID"                             "HttpGet\\(\"\\{id:int\\}\"\\)"                "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "Create author POST"                           "HttpPost"                                      "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "Update author PUT"                            "HttpPut"                                       "${PRJ}/Controllers/AuthorsController.cs"
check_grep  "Delete author DELETE"                         "HttpDelete"                                    "${PRJ}/Controllers/AuthorsController.cs"

